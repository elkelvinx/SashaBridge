[package]
name = "sashabridge_pc"
version = "2.1.0"
edition = "2024"

[dependencies]
anyhow             = "1"
base64             = "0.22"
futures-util       = "0.3"
# Captures and annotations travel as PNG; the clipboard holds bitmaps (S Pen "Anotar" mode).
png                = "0.18"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = ["full"] }
tokio-tungstenite  = "0.26"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "windows")'.dependencies]
# WinRT bindings for the System Media Transport Controls (media_controls.rs) and the
# notifications (notify.rs).
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Media",
    "Storage",
    "Storage_Streams",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_System_WinRT",
]}
# Win32 bindings for the hidden window, the job object, the single-instance mutex, the
# clipboard, global shortcut and Pictures folder of the annotation mode, the synthetic pen
# and monitors of the tablet mode, and the registry entry of the notifications.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]}

[target.'cfg(target_os = "windows")'.dev-dependencies]
# Lets the manual SMTC test read the session back the way third-party flyouts do.
windows = { version = "0.62", features = ["Foundation_Collections", "Media_Control"] }
