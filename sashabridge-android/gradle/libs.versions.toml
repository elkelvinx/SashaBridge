[versions]
agp = "9.5.0"
coreKtx = "1.19.1"
junit = "4.13.2"
appcompat = "1.8.0"
material = "1.14.0"
activityKtx = "1.13.0"
# Kotlin compiler used through the serialization plugin. It must be at least the version
# kotlinx-serialization was compiled with (2.4.10 for 1.12.0); AGP alone brings an older one.
kotlin = "2.4.21"
kotlinxSerialization = "1.12.0"
# Ktor and kotlinx-coroutines move together: Ktor calls internal coroutine APIs, so keep the
# coroutines version at least the one Ktor declares (1.11.0 for Ktor 3.6.0).
kotlinxCoroutines = "1.11.0"
ktor = "3.6.0"
lifecycle = "2.11.0"
# Room writes the history database on top of the phone's own SQLite; sqlite is the version
# Room 2.8.5 is built against (a newer sqlite would replace Room's own, untested together).
# KSP generates Room's code at build time.
room = "2.8.5"
#noinspection GradleDependency
sqlite = "2.6.2"
ksp = "2.3.13"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { group = "io.ktor", name = "ktor-server-websockets", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-websockets = { group = "io.ktor", name = "ktor-client-websockets", version.ref = "ktor" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-sqlite-framework = { group = "androidx.sqlite", name = "sqlite-framework", version.ref = "sqlite" }
androidx-sqlite-bundled-jvm = { group = "androidx.sqlite", name = "sqlite-bundled-jvm", version.ref = "sqlite" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }

